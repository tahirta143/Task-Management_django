{% extends 'base.html' %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; height: 80vh;">
    <div class="card" style="width: 100%; max-width: 400px;">
        <h2 class="text-center" style="margin-bottom: 2rem;">Login</h2>

        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
            <div class="alert alert-danger">
                Your username and password didn't match. Please try again.
            </div>
            {% endif %}

            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" class="form-control" id="id_username" required>
            </div>

            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" class="form-control" id="id_password" required>
            </div>

            <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 2rem;">
                <input type="checkbox" name="remember_me" id="remember_me"
                    style="width: 18px; height: 18px; cursor: pointer;">
                <label for="remember_me" style="margin-bottom: 0; cursor: pointer;">Remember Me</label>
            </div>

            <button type="submit" class="btn" style="width: 100%;">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}

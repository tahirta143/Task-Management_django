{% extends 'base.html' %}

{% block title %}Monthly Performance Report{% endblock %}

{% block content %}
<div class="header-section mb-4">
    <h1 style="font-weight: 700; color: var(--text-primary); letter-spacing: -0.04em; margin-bottom: 0.5rem;">Monthly
        Performance Report</h1>
    <p style="color: var(--text-secondary); font-size: 1.1rem;">Comprehensive analysis of task throughput and team
        efficiency over the last 6 months.</p>
</div>

<div class="card" style="padding: 2.5rem; border-radius: 1.5rem;">
    <div class="flex justify-between items-center mb-4">
        <div>
            <h3 style="margin-bottom: 0.25rem;">TASK VOLUME TREND</h3>
            <p style="font-size: 0.9rem; color: var(--text-secondary);">Total tasks created per month</p>
        </div>
        <div class="badge badge-success">Live Data</div>
    </div>

    <div style="height: 400px; position: relative; margin-top: 2rem;">
        <canvas id="monthlyFullChart"></canvas>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        fetch('{% url "monthly-stats" %}')
            .then(response => response.json())
            .then(data => {
                const ctx = document.getElementById('monthlyFullChart').getContext('2d');
                const gradient = ctx.createLinearGradient(0, 0, 0, 400);
                gradient.addColorStop(0, 'rgba(16, 185, 129, 0.4)');
                gradient.addColorStop(1, 'rgba(16, 185, 129, 0.0)');

                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: 'Tasks Created',
                            data: data.data,
                            borderColor: '#10b981',
                            borderWidth: 3,
                            fill: true,
                            backgroundColor: gradient,
                            tension: 0.4,
                            pointBackgroundColor: '#ffffff',
                            pointBorderColor: '#10b981',
                            pointBorderWidth: 2,
                            pointRadius: 6,
                            pointHoverRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: '#ffffff',
                                titleColor: '#0f172a',
                                bodyColor: '#64748b',
                                borderColor: '#e2e8f0',
                                borderWidth: 1,
                                padding: 12,
                                displayColors: false
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    stepSize: 1,
                                    color: '#64748b',
                                    font: { size: 12, weight: '500' }
                                },
                                grid: {
                                    display: true,
                                    color: 'rgba(226, 232, 240, 0.5)',
                                    drawBorder: false
                                },
                                border: { display: false }
                            },
                            x: {
                                ticks: {
                                    color: '#64748b',
                                    font: { size: 12, weight: '500' }
                                },
                                grid: { display: false },
                                border: { display: false }
                            }
                        }
                    }
                });
            });
    });
</script>
{% endblock %}
